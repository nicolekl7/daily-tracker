// WORKOUTS TAB
// ═══════════════════════════════════════════════════════════════════════════════
function WorkoutsTab({logs,setLogs}){
  const {C,card,inp,lbl}=React.useContext(ThemeCtx);
  const [date,setDate]=useState(todayStr());
  const [form,setForm]=useState({type:"Push",duration:"",intensity:7,notes:""});
  const [histOpen,setHistOpen]=useState(false);
  const [weeklyGoal,setWeeklyGoal]=useLS("mw_workout_goal",4);
  const log=logs[date]||{};
  const upd=(f,v)=>setLogs({...logs,[date]:{...(logs[date]||{}),[f]:v}});

  const addWorkout=()=>{
    const w=[...(log.workouts||[]),{id:Date.now(),type:form.type,duration:form.duration?+form.duration:null,intensity:form.intensity,notes:form.notes}];
    upd("workouts",w);setForm({type:"Push",duration:"",intensity:7,notes:""});
  };

  // Streak
  const streak=useMemo(()=>{
    let s=0;const d=new Date();
    for(let i=0;i<365;i++){
      d.setDate(d.getDate()-(i===0?0:1));
      const k=d.toISOString().split("T")[0];
      if((logs[k]?.workouts||[]).length>0)s++;else if(i>0)break;
    }
    return s;
  },[logs]);

  // This week
  const ws=weekStart(todayStr());
  const thisWeekDays=Array.from({length:7},(_,i)=>{
    const d=new Date(ws+"T12:00:00");d.setDate(d.getDate()+i);
    const k=d.toISOString().split("T")[0];
    const w=logs[k]?.workouts||[];
    return{k,dow:["M","T","W","T","F","S","S"][i],hasWorkout:w.length>0,types:w.map(x=>x.type)};
  });
  const thisWeekCount=thisWeekDays.filter(d=>d.hasWorkout).length;

  // 8-week chart
  const weeks=Array.from({length:8},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()-(7*(7-i)));
    const ws2=weekStart(d.toISOString().split("T")[0]);
    const we=new Date(ws2+"T12:00:00");we.setDate(we.getDate()+6);
    const we2=we.toISOString().split("T")[0];
    const count=Object.keys(logs).filter(k=>k>=ws2&&k<=we2&&(logs[k]?.workouts||[]).length>0).length;
    return{label:new Date(ws2+"T12:00:00").toLocaleDateString("en-US",{month:"numeric",day:"numeric"}),values:{workouts:count}};
  });

  // History
  const workoutDays=Object.entries(logs).filter(([,v])=>(v?.workouts||[]).length>0).sort((a,b)=>new Date(b[0])-new Date(a[0]));

  return(<div style={{display:"flex",flexDirection:"column",gap:18}}>
    <PTitle sub="Track your training">Workouts</PTitle>

    {/* Stats row */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
      <div style={{...card,textAlign:"center"}}><div style={lbl}>Streak</div><div style={{...serif,fontSize:44,fontWeight:300,color:C.accent,lineHeight:1.1}}>{streak}</div><div style={{fontSize:11,color:C.muted,marginTop:3}}>days</div></div>
      <div style={{...card,textAlign:"center"}}><div style={lbl}>This Week</div><div style={{...serif,fontSize:44,fontWeight:300,color:thisWeekCount>=weeklyGoal?C.sage:C.gold,lineHeight:1.1}}>{thisWeekCount}</div><div style={{fontSize:11,color:C.muted,marginTop:3}}>of {weeklyGoal} goal</div></div>
      <div style={{...card,textAlign:"center"}}><div style={lbl}>Weekly Goal</div><input type="number" value={weeklyGoal} onChange={e=>setWeeklyGoal(+e.target.value)} min={1} max={7} style={{...inp,textAlign:"center",...serif,fontSize:32,fontWeight:300,color:C.muted,background:"transparent",border:"none",padding:0,width:"100%",marginTop:4}} /></div>
    </div>

    {/* This week grid */}
    <div style={card}>
      <SHead right={<span style={{fontSize:11,color:C.faint}}>week of {new Date(ws+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>}>This Week</SHead>
      <div style={{display:"flex",gap:6}}>
        {thisWeekDays.map((d,i)=>(
          <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
            <div style={{fontSize:10,color:C.muted}}>{d.dow}</div>
            <div style={{width:"100%",aspectRatio:"1",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",background:d.hasWorkout?C.accent+"33":"transparent",border:`1px solid ${d.hasWorkout?C.accent+"66":C.border}`,fontSize:9,color:d.hasWorkout?C.accent:C.faint,fontWeight:600,overflow:"hidden"}}>{d.hasWorkout?(d.types[0]||"").slice(0,3).toUpperCase():""}</div>
            <div style={{width:6,height:6,borderRadius:"50%",background:d.k===todayStr()?C.accent:C.border}} />
          </div>
        ))}
      </div>
    </div>

    {/* Log Workout */}
    <div style={card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{...serif,fontSize:17,fontWeight:400,color:C.white}}>Log Workout</div>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...inp,width:"auto"}} />
      </div>
      {date!==todayStr()&&<div style={{fontSize:11,color:C.gold,marginBottom:12}}>Logging to {date}</div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        <div><label style={lbl}>Type</label><select value={form.type} onChange={e=>setForm({...form,type:e.target.value})} style={inp}>{WORKOUT_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
        <div><label style={lbl}>Duration (min)</label><input type="number" value={form.duration} onChange={e=>setForm({...form,duration:e.target.value})} placeholder="60" style={inp} /></div>
      </div>
      <div style={{marginBottom:12}}><Slider label="Intensity" emoji="🔥" value={form.intensity} onChange={v=>setForm({...form,intensity:v})} color={C.accent} /></div>
      <div style={{marginBottom:12}}><label style={lbl}>Notes</label><input value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="PRs, how you felt, exercises..." style={inp} /></div>
      <button onClick={addWorkout} style={{width:"100%",padding:"11px",borderRadius:9,background:C.accent,color:C.bg,border:"none",cursor:"pointer",fontSize:13,fontWeight:500}}>+ Log Workout</button>
    </div>

    {/* Today's workouts */}
    {(log.workouts||[]).length>0&&(
      <div style={card}>
        <SHead right={<span style={{fontSize:11,color:C.faint}}>{date}</span>}>Logged Workouts</SHead>
        {(log.workouts||[]).map((w,i)=>(
          <div key={w.id} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 0",borderBottom:i<log.workouts.length-1?`1px solid ${C.border}`:"none"}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:C.accent,flexShrink:0,marginTop:5}} />
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}><span style={{fontSize:13,fontWeight:500}}>{w.type}</span>{w.duration&&<span style={{fontSize:11,color:C.muted}}>{w.duration} min</span>}{w.intensity&&<span style={{fontSize:11,color:C.accent}}>Intensity {w.intensity}/10</span>}</div>
              {w.notes&&<div style={{fontSize:12,color:C.muted}}>{w.notes}</div>}
            </div>
            <button onClick={()=>upd("workouts",(log.workouts||[]).filter(x=>x.id!==w.id))} style={{background:"none",border:"none",color:C.faint,cursor:"pointer",fontSize:17,lineHeight:1,flexShrink:0}}>×</button>
          </div>
        ))}
      </div>
    )}

    {/* 8-week chart */}
    {weeks.some(w=>w.values.workouts>0)&&(
      <div style={card}>
        <SHead>8-Week Frequency</SHead>
        <MiniChart data={weeks} colors={{workouts:C.accent}} height={75} />
        <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>{weeks.map((w,i)=><div key={i} style={{flex:1,textAlign:"center",fontSize:9,color:C.faint}}>{w.label}</div>)}</div>
        <div style={{display:"flex",alignItems:"center",gap:5,marginTop:8,fontSize:11,color:C.muted}}><div style={{width:9,height:9,borderRadius:2,background:C.accent+"88"}} />Sessions per week</div>
      </div>
    )}

    {/* History */}
    {workoutDays.length>0&&(
      <div style={card}>
        <button onClick={()=>setHistOpen(!histOpen)} style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",background:"none",border:"none",cursor:"pointer",color:C.text,marginBottom:histOpen?12:0}}>
          <div style={{...serif,fontSize:17}}>Workout History</div>
          <span style={{fontSize:13,color:C.muted}}>{histOpen?"▾":"▸"} {workoutDays.length} sessions</span>
        </button>
        {histOpen&&workoutDays.slice(0,30).map(([d,v])=>(
          <div key={d} style={{padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
            <div style={{fontSize:11,color:C.muted,marginBottom:4}}>{d}</div>
            {(v.workouts||[]).map((w,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
                <div style={{width:6,height:6,borderRadius:"50%",background:C.accent,flexShrink:0}} />
                <span style={{fontSize:12,fontWeight:500}}>{w.type}</span>
                {w.duration&&<span style={{fontSize:11,color:C.muted}}>{w.duration}min</span>}
                {w.intensity&&<span style={{fontSize:11,color:C.accent}}>·{w.intensity}/10</span>}
                {w.notes&&<span style={{fontSize:11,color:C.faint}}>· {w.notes}</span>}
              </div>
            ))}
          </div>
        ))}
      </div>
    )}
  </div>);
}

// ═══════════════════════════════════════════════════════════════════════════════
// SPEND TAB
// ═══════════════════════════════════════════════════════════════════════════════
function SpendTab({logs,setLogs}){
  const {C,card,inp,lbl}=React.useContext(ThemeCtx);
  const [view,setView]=useState("month");
  const [addForm,setAddForm]=useState({amount:"",category:"",note:"",returnLikely:false,date:todayStr()});
  const allSpend=useMemo(()=>{
    const entries=[];
    Object.entries(logs).forEach(([date,v])=>{if(!v)return;if(v.spendItems&&v.spendItems.length>0)v.spendItems.forEach(item=>entries.push({date,amount:item.amount,category:item.category||"Other",note:item.note||"",returnLikely:item.returnLikely||false,id:item.id}));});
    return entries.sort((a,b)=>new Date(b.date)-new Date(a.date));
  },[logs]);
  const addItem=()=>{
    if(!addForm.amount||isNaN(parseFloat(addForm.amount)))return;
    const date=addForm.date||todayStr();
    const newItem={id:Date.now(),amount:parseFloat(addForm.amount),category:addForm.category||"Other",note:addForm.note,returnLikely:addForm.returnLikely};
    setLogs(prev=>{const existing=prev[date]||{};return{...prev,[date]:{...existing,spendItems:[...(existing.spendItems||[]),newItem]}};});
    setAddForm({amount:"",category:"",note:"",returnLikely:false,date:todayStr()});
  };
  const deleteItem=(date,id)=>{if(!id)return;setLogs(prev=>({...prev,[date]:{...prev[date],spendItems:(prev[date]?.spendItems||[]).filter(i=>i.id!==id)}}));};
  const toggleReturn=(date,id)=>{if(!id)return;setLogs(prev=>({...prev,[date]:{...prev[date],spendItems:(prev[date]?.spendItems||[]).map(i=>i.id===id?{...i,returnLikely:!i.returnLikely}:i)}}));};
  const now=new Date();
  const thisMonth=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const thisWeekStart2=weekStart(todayStr());
  const net=allSpend.filter(s=>!s.returnLikely);
  const monthTotal=net.filter(s=>s.date.startsWith(thisMonth)).reduce((sum,s)=>sum+s.amount,0);
  const weekTotal=net.filter(s=>s.date>=thisWeekStart2).reduce((sum,s)=>sum+s.amount,0);
  const todayTotal=net.filter(s=>s.date===todayStr()).reduce((sum,s)=>sum+s.amount,0);
  const pendingRet=allSpend.filter(s=>s.returnLikely).reduce((sum,s)=>sum+s.amount,0);
  const filtered=view==="month"?net.filter(s=>s.date.startsWith(thisMonth)):net.filter(s=>s.date>=thisWeekStart2);
  const catTotals={};filtered.forEach(s=>{catTotals[s.category]=(catTotals[s.category]||0)+s.amount;});
  const catSorted=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const catMax=catSorted.length>0?catSorted[0][1]:1;
  const viewTotal=catSorted.reduce((s,[,v])=>s+v,0);
  const weeks=Array.from({length:8},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(7*(7-i)));const ws=weekStart(d.toISOString().split("T")[0]);const we=new Date(ws+"T12:00:00");we.setDate(we.getDate()+6);return{label:new Date(ws+"T12:00:00").toLocaleDateString("en-US",{month:"numeric",day:"numeric"}),values:{spend:net.filter(s=>s.date>=ws&&s.date<=we.toISOString().split("T")[0]).reduce((sum,s)=>sum+s.amount,0)}};});
  return(<div style={{display:"flex",flexDirection:"column",gap:18}}>
    <PTitle>Spend</PTitle>
    <div style={card}>
      <SHead>Log Spend</SHead>
      <div style={{display:"grid",gridTemplateColumns:"90px 1fr",gap:8,marginBottom:7}}><div><label style={lbl}>Amount</label><div style={{display:"flex",alignItems:"center",gap:4}}><span style={{color:C.muted,fontSize:13}}>$</span><input type="number" step="0.01" value={addForm.amount} onChange={e=>setAddForm({...addForm,amount:e.target.value})} onKeyDown={e=>e.key==="Enter"&&addItem()} placeholder="0.00" style={{...inp,...serif,fontSize:15}} /></div></div><div><label style={lbl}>Category</label><select value={addForm.category} onChange={e=>setAddForm({...addForm,category:e.target.value})} style={inp}><option value="">Category</option>{SPEND_CATS.map(c=><option key={c} value={c}>{c}</option>)}</select></div></div>
      <div style={{display:"flex",gap:7,alignItems:"flex-end",marginBottom:7}}><div style={{flex:1}}><label style={lbl}>Note</label><input value={addForm.note} onChange={e=>setAddForm({...addForm,note:e.target.value})} onKeyDown={e=>e.key==="Enter"&&addItem()} placeholder="What was it?" style={inp} /></div><div><label style={lbl}>Date</label><input type="date" value={addForm.date} onChange={e=>setAddForm({...addForm,date:e.target.value})} style={{...inp,padding:"9px 8px"}} /></div></div>
      <div style={{display:"flex",gap:7}}><button onClick={()=>setAddForm({...addForm,returnLikely:!addForm.returnLikely})} style={{padding:"9px 11px",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:500,background:addForm.returnLikely?C.gold+"22":"transparent",border:`1px solid ${addForm.returnLikely?C.gold:C.border}`,color:addForm.returnLikely?C.gold:C.muted}}>↩ Return?</button><button onClick={addItem} style={{padding:"9px 16px",borderRadius:8,background:C.accent,color:C.bg,border:"none",cursor:"pointer",fontSize:13,fontWeight:500,flex:1}}>+ Add</button></div>
    </div>
    <div style={{display:"flex",gap:10}}>{[{l:"Today",v:todayTotal,c:C.sage},{l:"This Week",v:weekTotal,c:C.gold},{l:"This Month",v:monthTotal,c:C.accent}].map(({l,v,c})=>(<div key={l} style={{...card,flex:1,textAlign:"center"}}><div style={lbl}>{l}</div><div style={{...serif,fontSize:26,fontWeight:300,color:c,lineHeight:1}}>${v.toFixed(0)}<span style={{fontSize:11,color:C.muted}}>.{String(Math.round((v%1)*100)).padStart(2,"0")}</span></div></div>))}</div>
    {pendingRet>0&&<div style={{...card,padding:"11px 16px",display:"flex",alignItems:"center",gap:10,borderLeft:`3px solid ${C.gold}`}}><span>↩</span><div><div style={lbl}>Pending Returns</div><div style={{fontSize:13,color:C.gold}}>${pendingRet.toFixed(2)} excluded from totals</div></div></div>}
    <div style={card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><div style={{...serif,fontSize:17,color:C.white}}>By Category</div><div style={{display:"flex",gap:5}}>{["week","month"].map(v=><button key={v} onClick={()=>setView(v)} style={{padding:"4px 11px",borderRadius:12,fontSize:11,cursor:"pointer",fontWeight:500,background:view===v?C.accent+"22":"transparent",border:`1px solid ${view===v?C.accent:C.border}`,color:view===v?C.accent:C.muted}}>{v==="week"?"Week":"Month"}</button>)}</div></div>
      {catSorted.length===0?<div style={{textAlign:"center",padding:"16px 0",color:C.faint,fontSize:13}}>No spend this period.</div>:catSorted.map(([cat,amt])=>(<div key={cat} style={{marginBottom:11}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><div style={{display:"flex",alignItems:"center",gap:7}}><div style={{width:7,height:7,borderRadius:"50%",background:CAT_COLORS[cat]||C.muted}} /><span style={{fontSize:13}}>{cat}</span></div><div style={{display:"flex",gap:9,alignItems:"center"}}><span style={{fontSize:11,color:C.muted}}>{Math.round((amt/viewTotal)*100)}%</span><span style={{...serif,fontSize:15,color:CAT_COLORS[cat]||C.muted}}>${amt.toFixed(0)}</span></div></div><div style={{height:4,background:C.border,borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:((amt/catMax)*100)+"%",background:(CAT_COLORS[cat]||C.muted)+"BB"}} /></div></div>))}
    </div>
    {allSpend.length>=4&&<div style={card}><SHead>Weekly Trend</SHead><MiniChart data={weeks} colors={{spend:C.gold}} height={75} /><div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>{weeks.map((w,i)=><div key={i} style={{flex:1,textAlign:"center",fontSize:9,color:C.faint}}>{w.label}</div>)}</div></div>}
    <div style={card}>
      <SHead>Recent</SHead>
      {allSpend.length===0?<div style={{textAlign:"center",padding:"16px 0",color:C.faint,fontSize:13}}>No spend logged yet.</div>:allSpend.slice(0,30).map((s,i)=>(
        <div key={s.id||i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:`1px solid ${C.border}`,opacity:s.returnLikely?0.5:1}}>
          <div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:7,marginBottom:1,flexWrap:"wrap"}}><div style={{width:6,height:6,borderRadius:"50%",background:CAT_COLORS[s.category]||C.muted,flexShrink:0}} /><span style={{fontSize:11,color:C.muted}}>{s.category}</span><span style={{fontSize:10,color:C.faint}}>· {s.date}</span>{s.returnLikely&&<span style={{fontSize:9,color:C.gold,background:C.gold+"18",borderRadius:7,padding:"1px 5px"}}>↩</span>}</div>{s.note&&<div style={{fontSize:12,color:C.text,paddingLeft:13}}>{s.note}</div>}</div>
          <div style={{display:"flex",alignItems:"center",gap:6,marginLeft:10}}><div style={{...serif,fontSize:16,color:s.returnLikely?C.gold:C.text,textDecoration:s.returnLikely?"line-through":"none"}}>${s.amount.toFixed(2)}</div>{s.id&&<><button onClick={()=>toggleReturn(s.date,s.id)} style={{background:"none",border:`1px solid ${s.returnLikely?C.gold+"66":C.border}`,borderRadius:5,color:s.returnLikely?C.gold:C.faint,cursor:"pointer",fontSize:11,padding:"2px 7px"}}>↩</button><button onClick={()=>deleteItem(s.date,s.id)} style={{background:"none",border:"none",color:C.faint,cursor:"pointer",fontSize:17,lineHeight:1}}>×</button></>}</div>
        </div>
      ))}
    </div>
  </div>);
}

// ═══════════════════════════════════════════════════════════════════════════════
// DATA PANEL
// ═══════════════════════════════════════════════════════════════════════════════
function DataPanel({onClose}){
  const {C,inp,lbl,card}=React.useContext(ThemeCtx);
  const [msg,setMsg]=useState("");
  const [cloudName,setCloudName]=useLS("mw_cloudinary_name","");
  const [cloudPreset,setCloudPreset]=useLS("mw_cloudinary_preset","Daily Tracker");
  const [testMsg,setTestMsg]=useState("");const [testing,setTesting]=useState(false);
  const testCloudinary=async()=>{
    if(!cloudName.trim()||!cloudPreset.trim()){setTestMsg("Enter cloud name and preset first");setTimeout(()=>setTestMsg(""),3000);return;}
    setTesting(true);setTestMsg("");
    try{const fd=new FormData();fd.append("file","data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVQI12NgAAIABQAABjE+ibYAAAAASUVORK5CYII=");fd.append("upload_preset",cloudPreset.trim());const res=await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(cloudName.trim())}/image/upload`,{method:"POST",body:fd});const d=await res.json();if(res.ok){setTestMsg("Connected ✓");}else{setTestMsg("Error: "+(d?.error?.message||res.status));}}catch{setTestMsg("Connection failed — check your cloud name");}
    setTesting(false);setTimeout(()=>setTestMsg(""),6000);
  };
  const exportAll=()=>{
    const keys=Object.keys(localStorage).filter(k=>k.startsWith("mw_"));
    const out={};keys.forEach(k=>{try{out[k]=JSON.parse(localStorage.getItem(k));}catch{out[k]=localStorage.getItem(k);}});
    const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="daily-os-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url);
    setMsg("Exported ✓");setTimeout(()=>setMsg(""),3000);
  };
  const importFile=e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.mw_daily){const existing=JSON.parse(localStorage.getItem("mw_daily")||"{}");const merged={...data.mw_daily};Object.entries(existing).forEach(([d,v])=>{if(!merged[d])merged[d]=v;else merged[d]={...merged[d],...Object.fromEntries(Object.entries(v).filter(([,val])=>val!=null&&val!==""))};});data.mw_daily=merged;}
        Object.entries(data).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));
        setMsg("Imported ✓ — reloading...");setTimeout(()=>window.location.reload(),1200);
      }catch{setMsg("Invalid file — check format");}
    };r.readAsText(f);
  };
  return(<Modal onClose={onClose}><div style={{...card,maxWidth:440}}>
    <div style={{...serif,fontSize:22,color:C.white,marginBottom:5}}>Data & Sync</div>
    <div style={{marginBottom:20,padding:"14px 16px",background:C.surface,borderRadius:10,border:`1px solid ${cloudName?C.sage+"44":C.border}`}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><div style={{fontSize:13,fontWeight:500,color:C.white}}>☁ Cloudinary Photo Storage</div>{cloudName&&<span style={{fontSize:10,padding:"2px 7px",borderRadius:8,background:C.sage+"22",color:C.sage}}>connected</span>}</div>
      <div style={{fontSize:11,color:C.muted,marginBottom:12,lineHeight:1.6}}>Photos upload to Cloudinary instead of being stored in the browser. Works from any device automatically.</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}><div><div style={lbl}>Cloud Name</div><input value={cloudName} onChange={e=>setCloudName(e.target.value.trim())} placeholder="e.g. dxyz12abc" style={inp} /></div><div><div style={lbl}>Upload Preset</div><input value={cloudPreset} onChange={e=>setCloudPreset(e.target.value)} placeholder="Daily Tracker" style={inp} /></div></div>
      <div style={{display:"flex",alignItems:"center",gap:10}}><button onClick={testCloudinary} disabled={testing} style={{padding:"7px 14px",borderRadius:7,background:C.sage+"22",border:`1px solid ${C.sage}44`,color:C.sage,cursor:"pointer",fontSize:12,fontWeight:500}}>{testing?"Testing...":"Test connection"}</button>{testMsg&&<span style={{fontSize:11,color:testMsg.includes("✓")?C.sage:C.danger}}>{testMsg}</span>}</div>
    </div>
    <div style={{fontSize:12,color:C.muted,lineHeight:1.7,marginBottom:16}}>All other data is saved <strong style={{color:C.text}}>in this browser only</strong>. Export/import to move between devices.</div>
    <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
      <button onClick={exportAll} style={{padding:"12px 16px",borderRadius:9,background:C.sage+"18",border:`1px solid ${C.sage}44`,color:C.sage,cursor:"pointer",fontSize:13,fontWeight:500,textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span>↓ Export backup</span><span style={{fontSize:11,color:C.muted}}>downloads a .json</span></button>
      <label style={{padding:"12px 16px",borderRadius:9,background:C.accent+"12",border:`1px solid ${C.accent}33`,color:C.accent,cursor:"pointer",fontSize:13,fontWeight:500,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span>↑ Import backup</span><span style={{fontSize:11,color:C.muted}}>merges — nothing deleted</span><input type="file" accept=".json" onChange={importFile} style={{display:"none"}} /></label>
    </div>
    {msg&&<div style={{fontSize:12,color:C.sage,padding:"8px 12px",background:C.sage+"12",borderRadius:7,marginBottom:12}}>{msg}</div>}
    <div style={{fontSize:11,color:C.faint,lineHeight:1.6,padding:"11px 14px",background:C.surface,borderRadius:8}}><strong style={{color:C.muted}}>Sync between devices</strong><br/>1. Open app → ⊙ Sync → Export backup<br/>2. Transfer the .json file to the other device<br/>3. Open app → ⊙ Sync → Import backup</div>
  </div></Modal>);
}

// ═══════════════════════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════════════════════
const TABS=[
  {id:"tracker",label:"Tracker"},
  {id:"skin",label:"Skin"},
  {id:"workouts",label:"Workouts"},
  {id:"spend",label:"Spend"},
];

function App(){
  const [tab,setTab]=useState("dashboard");
  const [dailyLogs,setDailyLogs]=useLS("mw_daily",{});
  const [groomingLogs,setGroomingLogs]=useLS("mw_grooming",{});
  const [groomingIntervals,setGroomingIntervals]=useLS("mw_grooming_intervals",{});
  const [userName,setUserName]=useLS("mw_name","");
  const [showData,setShowData]=useState(false);
  const [showNameEdit,setShowNameEdit]=useState(false);
  const [showSaved,setShowSaved]=useState(false);
  const savedSkip=useRef(true);

  const [themeMode,setThemeMode]=useLS("mw_theme","auto");
  const isDayTime=()=>{const h=new Date().getHours();return h>=6&&h<20;};
  const [isDay,setIsDay]=useState(()=>themeMode==="dark"?false:themeMode==="light"?true:isDayTime());
  useEffect(()=>{setIsDay(themeMode==="dark"?false:themeMode==="light"?true:isDayTime());},[themeMode]);
  useEffect(()=>{if(themeMode!=="auto")return;const id=setInterval(()=>setIsDay(isDayTime()),60000);return()=>clearInterval(id);},[themeMode]);

  const C=useMemo(()=>isDay?LIGHT_C:DARK_C,[isDay]);
  const card=useMemo(()=>({background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"20px 22px"}),[C]);
  const inp=useMemo(()=>({background:C.surface,color:C.text,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 13px",fontFamily:"'DM Sans', sans-serif",fontSize:13,width:"100%",transition:"border-color 0.2s"}),[C]);
  const lbl=useMemo(()=>({fontSize:10,letterSpacing:"0.12em",textTransform:"uppercase",color:C.muted,marginBottom:6,display:"block",fontFamily:"'DM Sans', sans-serif",fontWeight:500}),[C]);

  useEffect(()=>{
    const r=document.documentElement.style;
    r.setProperty("--bg",C.bg);r.setProperty("--surface",C.surface);r.setProperty("--faint",C.faint);r.setProperty("--card",C.card);r.setProperty("--text",C.text);
    document.body.style.background=C.bg;
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content",C.bg);
  },[C]);

  const cycleTheme=()=>setThemeMode(m=>m==="auto"?(isDay?"dark":"light"):m==="dark"?"light":"auto");
  const themeIcon=themeMode==="auto"?"⊙":isDay?"☀":"🌙";

  useEffect(()=>{
    if(savedSkip.current){savedSkip.current=false;return;}
    setShowSaved(true);const t=setTimeout(()=>setShowSaved(false),2000);return()=>clearTimeout(t);
  },[dailyLogs]);

  return(
    <ThemeCtx.Provider value={{C,card,inp,lbl,isDay,themeMode,setThemeMode}}>
    <div style={{fontFamily:"'DM Sans', sans-serif",background:C.bg,minHeight:"100vh",color:C.text,transition:"background 0.4s,color 0.4s"}}>
      <div style={{position:"fixed",inset:0,background:"radial-gradient(ellipse at 15% 40%,#6A8FAA05 0%,transparent 55%),radial-gradient(ellipse at 85% 20%,#7A9B8A04 0%,transparent 50%)",pointerEvents:"none",zIndex:0}} />
      <div style={{position:"sticky",top:0,zIndex:100,background:C.bg+"F4",backdropFilter:"blur(16px)",borderBottom:`1px solid ${C.border}`,transition:"background 0.4s,border-color 0.4s"}}>
        <div style={{maxWidth:960,margin:"0 auto",padding:"0 20px"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,height:54}}>
            <button onClick={()=>setTab("dashboard")} title="Home" style={{fontSize:18,color:C.accent,flexShrink:0,background:"none",border:"none",cursor:"pointer",padding:"0 2px",lineHeight:1}}>⌂</button>
            <div style={{display:"flex",gap:3,overflowX:"auto",paddingBottom:2,flex:1}}>
              {TABS.map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"5px 13px",borderRadius:20,fontSize:11,fontWeight:500,letterSpacing:"0.04em",cursor:"pointer",whiteSpace:"nowrap",border:`1px solid ${tab===t.id?C.accent:C.border}`,background:tab===t.id?C.accent+"18":"transparent",color:tab===t.id?C.accent:C.muted,transition:"all 0.15s"}}>
                  {t.label}
                </button>
              ))}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
              <span style={{fontSize:11,color:C.sage,transition:"opacity 0.4s",opacity:showSaved?1:0,pointerEvents:"none"}}>✓ saved</span>
              {showNameEdit
                ?<input autoFocus value={userName} onChange={e=>setUserName(e.target.value)} onBlur={()=>setShowNameEdit(false)} onKeyDown={e=>e.key==="Enter"&&setShowNameEdit(false)} placeholder="Your name" style={{...inp,width:100,padding:"3px 8px",fontSize:12}} />
                :<button onClick={()=>setShowNameEdit(true)} style={{padding:"4px 9px",borderRadius:14,fontSize:11,cursor:"pointer",border:`1px solid ${C.border}`,background:"transparent",color:C.muted}}>{userName||"Set name"}</button>
              }
              <button onClick={cycleTheme} title={themeMode==="auto"?"Auto":isDay?"Light":"Dark"} style={{padding:"4px 9px",borderRadius:14,fontSize:13,cursor:"pointer",border:`1px solid ${themeMode!=="auto"?C.accent:C.border}`,background:themeMode!=="auto"?C.accent+"18":"transparent",color:themeMode!=="auto"?C.accent:C.muted,transition:"all 0.15s"}}>{themeIcon}</button>
              <button onClick={()=>setShowData(true)} title="Data sync & export" style={{padding:"4px 10px",borderRadius:14,fontSize:11,cursor:"pointer",border:`1px solid ${C.border}`,background:"transparent",color:C.muted,whiteSpace:"nowrap",transition:"all 0.15s"}}>⊙ Sync</button>
            </div>
          </div>
        </div>
      </div>
      {showData&&<DataPanel onClose={()=>setShowData(false)} />}
      <div style={{position:"relative",zIndex:1,padding:"26px 20px 80px"}}>
        <div style={{maxWidth:960,margin:"0 auto"}}>
          {tab==="dashboard"&&<Dashboard dailyLogs={dailyLogs} setDailyLogs={setDailyLogs} groomingLogs={groomingLogs} groomingIntervals={groomingIntervals} userName={userName} />}
          {tab==="tracker"&&<TrackerTab logs={dailyLogs} setLogs={setDailyLogs} />}
          {tab==="skin"&&<SkinTab logs={dailyLogs} setLogs={setDailyLogs} groomingLogs={groomingLogs} setGroomingLogs={setGroomingLogs} groomingIntervals={groomingIntervals} setGroomingIntervals={setGroomingIntervals} />}
          {tab==="workouts"&&<WorkoutsTab logs={dailyLogs} setLogs={setDailyLogs} />}
          {tab==="spend"&&<SpendTab logs={dailyLogs} setLogs={setDailyLogs} />}
        </div>
      </div>
    </div>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
